  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}
async function attempt(pw, remember) {
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = 'Unlocking…';
  try {
    const html = await unlock(pw);
    if (remember) localStorage.setItem('vn_dash_pw', pw); else sessionStorage.setItem('vn_dash_pw', pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    localStorage.removeItem('vn_dash_pw'); sessionStorage.removeItem('vn_dash_pw');
    err.textContent = 'That passphrase didn\'t work.';
    go.disabled = false;
  }
}
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  attempt(document.getElementById('pw').value.trim(), document.getElementById('rem').checked);
});
const saved = localStorage.getItem('vn_dash_pw') || sessionStorage.getItem('vn_dash_pw');
if (saved) attempt(saved, !!localStorage.getItem('vn_dash_pw'));
</script>
