<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@400;500&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Jost','Segoe UI',sans-serif; background:#fdf9f3; color:#2a2218; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .card { max-width:380px; width:100%; text-align:center; }
  .wordmark { font-family:'Cormorant Garamond',Georgia,serif; letter-spacing:.34em; font-size:.9rem; color:#8a7d6a; text-transform:uppercase; }

  p { font-size:.82rem; color:#8a7d6a; margin-bottom:1.4rem; }
  .rule { width:44px; height:1px; background:#c49a52; margin:1rem auto 1.4rem; }
  input[type=password] { width:100%; padding:.8rem 1rem; border:1px solid rgba(196,154,82,.4); background:#fff; font-family:inherit; font-size:.95rem; text-align:center; letter-spacing:.08em; outline:none; }
  input[type=password]:focus { border-color:#c49a52; }
  button { width:100%; margin-top:.7rem; padding:.8rem; background:#3a4f3c; color:#f7f0e3; border:none; cursor:pointer; font-family:inherit; font-size:.72rem; font-weight:500; letter-spacing:.22em; text-transform:uppercase; }
  button:hover { background:#2e3f30; }
  button:disabled { opacity:.6; cursor:wait; }
  label { display:flex; gap:.45rem; justify-content:center; align-items:center; margin-top:.9rem; font-size:.74rem; color:#8a7d6a; cursor:pointer; }
  .err { color:#a4682c; font-size:.78rem; margin-top:.8rem; min-height:1.1em; }
</style>

async function unlock(pass) {
  const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:600000, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  const pass = document.getElementById('pw').value;
  try {
    if (document.getElementById('rem').checked) localStorage.setItem('vn_hub_pw', pass);
    await unlock(pass);
  } catch (_) {
    localStorage.removeItem('vn_hub_pw');
    err.textContent = 'That password did not unlock the page.';
    btn.disabled = false;
  }
});
const saved = localStorage.getItem('vn_hub_pw');
if (saved) unlock(saved).catch(() => localStorage.removeItem('vn_hub_pw'));
